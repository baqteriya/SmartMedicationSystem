<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Medicine</title>
</head>

<body>

<h2>Edit Medicine</h2>

<form th:action="@{/edit-medicine}" th:object="${medicine}" method="post">

    <!-- Medicine ID hidden rahegi -->
    <input type="hidden" th:field="*{id}">

    <label>Medicine Name:</label>
    <input type="text" th:field="*{medicineName}" required>
    <br><br>

    <label>Dosage:</label>
    <input type="text" th:field="*{dosage}" required>
    <br><br>

    <label>Time:</label>
    <input type="time" th:field="*{time}" required>
    <br><br>

    <label>Start Date:</label>
    <input type="date" th:field="*{startDate}" required>
    <br><br>

    <label>End Date:</label>
    <input type="date" th:field="*{endDate}" required>
    <br><br>

    <button type="submit">Update Medicine</button>

</form>

<br>

<a href="/medicines">Back to Medicines</a>

</body>

</html>
