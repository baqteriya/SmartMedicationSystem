<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Medicine - Smart Medication</title>
</head>

<body>

<h2>Add Medicine</h2>

<form th:action="@{/add-medicine}" th:object="${medicine}" method="post">

    <label>Medicine Name:</label>
    <input type="text" th:field="*{medicineName}" required>
    <br><br>

    <label>Dosage:</label>
    <input type="text" th:field="*{dosage}" placeholder="e.g. 500 mg" required>
    <br><br>

    <label>Time:</label>
    <input type="time" th:field="*{time}" required>
    <br><br>

    <label>Start Date:</label>
    <input type="date" th:field="*{startDate}" required>
    <br><br>

    <label>End Date:</label>
    <input type="date" th:field="*{endDate}" required>
    <br><br>

    <button type="submit">Save Medicine</button>

</form>

<br>

<a href="/dashboard">Back to Dashboard</a>

</body>

</html>
